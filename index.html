<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>semreview</title>
<style>
:root {
  --bg: #fff; --fg: #1f2328; --muted: #656d76; --line: #d0d7de; --panel: #f6f8fa;
  --add: #e6ffec; --add-ln: #ccffd8; --del: #ffebe9; --del-ln: #ffd7d5; --hl: #fff8c5;
  --accent: #0969da; --crumb: #eef4ff;
  --c-comment: #6e7781; --c-kw: #cf222e; --c-str: #0a3069; --c-num: #0550ae; --c-type: #8250df; --c-param: #953800; --c-tag: #116329;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --line: #30363d; --panel: #161b22;
    --add: #12261e; --add-ln: #1b4721; --del: #25171c; --del-ln: #542426; --hl: #3b2e00;
    --accent: #4493f8; --crumb: #121d2f;
    --c-comment: #8b949e; --c-kw: #ff7b72; --c-str: #a5d6ff; --c-num: #79c0ff; --c-type: #d2a8ff; --c-param: #ffa657; --c-tag: #7ee787;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
button:hover { border-color: var(--accent); }
a { color: var(--accent); cursor: pointer; text-decoration: none; }
code, pre, .mono { font: 12.5px/20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
#top { height: 44px; display: flex; gap: 12px; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
#top .title { font-weight: 600; }
#top .grow { flex: 1; }
#layout { display: flex; height: calc(100% - 44px); }
#side { width: 300px; flex: none; overflow: auto; border-right: 1px solid var(--line); padding: 8px 0; }
#main { flex: 1; overflow: auto; min-width: 0; }
#peek { width: 45%; flex: none; overflow: auto; border-left: 1px solid var(--line); }
#peek[hidden] { display: none; }
.tabs { display: flex; gap: 4px; padding: 0 8px 8px; }
.tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.sg { padding: 8px 12px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.sf { padding: 4px 12px 0; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.done { text-decoration: line-through; opacity: .7; }
.sy { display: flex; gap: 6px; padding: 1px 12px 1px 20px; font-size: 13px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sy:hover, .sf:hover { background: var(--panel); }
.badge { font: 11px/16px ui-monospace, monospace; width: 16px; text-align: center; border-radius: 4px; flex: none; }
.b-added { background: var(--add-ln); } .b-removed { background: var(--del-ln); } .b-modified { background: var(--hl); } .b-format { background: var(--panel); color: var(--muted); }
.ghead { padding: 16px 16px 4px; font-weight: 600; color: var(--muted); }
.file { margin: 8px 16px 16px; border: 1px solid var(--line); border-radius: 6px; }
.fh { position: sticky; top: 0; z-index: 3; height: 36px; display: flex; gap: 8px; align-items: center; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0; }
.fh .fp { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.fh .grow { flex: 1; }
.fh a { white-space: nowrap; }
.fh label { font-size: 12px; color: var(--muted); white-space: nowrap; }
.st { font: 11px/18px ui-monospace, monospace; padding: 0 5px; border-radius: 4px; background: var(--hl); }
.st-A { background: var(--add-ln); } .st-D { background: var(--del-ln); }
.stat { font-size: 12px; color: var(--muted); white-space: nowrap; }
.file.closed .body { display: none; }
.note { padding: 8px 12px; color: var(--muted); font-size: 13px; }
.run { border-top: 1px solid var(--line); }
.run:first-child { border-top: 0; }
.crumb { position: sticky; top: 36px; z-index: 2; background: var(--crumb); border-bottom: 1px solid var(--line); padding: 2px 10px; font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 0 8px; align-items: baseline; }
.crumb .k { color: var(--muted); font-size: 11px; }
.crumb .sig { flex-basis: 100%; white-space: pre; overflow: hidden; text-overflow: ellipsis; opacity: .8; }
.crumb button { padding: 0 6px; font-size: 11px; }
.gap { padding: 2px 10px; font-size: 12px; color: var(--accent); background: var(--panel); cursor: pointer; border-top: 1px solid var(--line); }
.r { display: flex; min-height: 20px; }
.r .ln { flex: none; width: 48px; padding-right: 8px; text-align: right; color: var(--muted); user-select: none; font: 12px/20px ui-monospace, monospace; }
.r code { flex: 1; white-space: pre; padding-left: 14px; position: relative; tab-size: 2; }
.r code::before { position: absolute; left: 3px; color: var(--muted); }
.r.add { background: var(--add); } .r.add .ln { background: var(--add-ln); } .r.add code::before { content: "+"; }
.r.del { background: var(--del); } .r.del .ln { background: var(--del-ln); } .r.del code::before { content: "−"; }
.r.hl { background: var(--hl); }
.c1 { color: var(--c-comment); font-style: italic; } .c3 { color: var(--c-kw); } .c4, .c25 { color: var(--c-num); }
.c6, .c7, .c24 { color: var(--c-str); } .c11, .c12, .c13, .c14, .c15, .c16 { color: var(--c-type); } .c17 { color: var(--c-param); }
.c19, .c20, .c21 { color: var(--c-tag); } .c22 { color: var(--c-type); }
body.mod .r code span:hover { text-decoration: underline; cursor: pointer; }
#tip { position: fixed; z-index: 10; max-width: 640px; max-height: 50vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; box-shadow: 0 4px 16px #0003; pointer-events: none; }
#tip pre { margin: 0; white-space: pre-wrap; }
#tip .doc { margin-top: 6px; font-size: 13px; white-space: pre-wrap; }
.pbar { position: sticky; top: 0; z-index: 3; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
.pbar .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#api { margin: 8px 16px; border: 1px solid var(--line); border-radius: 6px; }
#api[hidden] { display: none; }
#api h3 { margin: 0; padding: 8px 12px; font-size: 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
.apie { padding: 6px 12px; border-bottom: 1px solid var(--line); }
.apie pre { margin: 4px 0 0; padding: 4px 8px; white-space: pre-wrap; border-radius: 4px; }
.apie .b { background: var(--del); } .apie .a { background: var(--add); }
.hiddenlist { margin: 8px 16px 32px; color: var(--muted); font-size: 13px; }
@media (max-width: 800px) { #side { display: none; } #peek { position: fixed; inset: 44px 0 0 0; width: auto; background: var(--bg); z-index: 5; } }
</style>
</head>
<body>
<div id="top">
  <span class="title">semreview</span>
  <span id="info" class="mono"></span>
  <span class="grow"></span>
  <span class="stat">hover: types · Ctrl/⌘-click: definition · j/k: files · Esc: close peek</span>
  <button id="apiBtn" title="Compare exported signatures (builds base and head programs)">API changes</button>
  <button id="reload">Reload</button>
</div>
<div id="layout">
  <nav id="side">
    <div class="tabs"><button data-tab="symbols" aria-pressed="true">Symbols</button><button data-tab="files" aria-pressed="false">Files</button></div>
    <div id="sideBody"></div>
  </nav>
  <main id="main"><section id="api" hidden></section><div id="files"></div></main>
  <aside id="peek" hidden></aside>
</div>
<div id="tip" hidden></div>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const CONTEXT = 3;
// API lives under the page's own path: /snaha/swarm-id/pull/914/-/api/review
const API = location.pathname.replace(/\/+$/, '') + '/-/api/';
const BASE = new URLSearchParams(location.search).get('base');
const api = (ep, q = '') => fetch(`${API}${ep}?${q}${BASE ? `&base=${encodeURIComponent(BASE)}` : ''}`);
let R, tab = 'symbols';
const store = { // per-viewer "reviewed" marks; the page works without storage
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

// ---------- text ----------
function prep(sd) { // lines + one classification id per character
  if (!sd || sd.lines) return sd;
  sd.lines = sd.text.split('\n');
  if (sd.lines.at(-1) === '') sd.lines.pop();
  sd.starts = [];
  for (let i = 0, p = 0; i < sd.lines.length; p += sd.lines[i].length + 1, i++) sd.starts.push(p);
  sd.kinds = new Uint8Array(sd.text.length);
  for (let i = 0; i < sd.cls.length; i += 3) sd.kinds.fill(sd.cls[i + 2], sd.cls[i], sd.cls[i] + sd.cls[i + 1]);
  return sd;
}
function lineHtml(sd, n) { // 1-based
  const s = sd.lines[n - 1] ?? '', base = sd.starts[n - 1];
  let html = '';
  for (let i = 0, j; i < s.length; i = j) {
    const k = sd.kinds[base + i];
    for (j = i + 1; j < s.length && sd.kinds[base + j] === k; j++);
    html += `<span class="c${k}">${esc(s.slice(i, j))}</span>`;
  }
  return html;
}
function innermost(syms, line) {
  let best = null;
  for (const s of syms ?? []) if (s.start <= line && line <= s.end && (!best || s.start >= best.start)) best = s;
  return best;
}

// ---------- per file model ----------
function build(f) {
  prep(f.old); prep(f.new);
  const rows = [];
  let o = 1, n = 1;
  const eq = (until) => { while (o < until) rows.push({ t: ' ', o: o++, n: n++ }); };
  for (const h of f.hunks ?? []) { // -U0 hunks; an insertion's oldStart is the line before it
    eq(h.oldLines ? h.oldStart : h.oldStart + 1);
    for (let i = 0; i < h.oldLines; i++) rows.push({ t: '-', o: o++ });
    for (let i = 0; i < h.newLines; i++) rows.push({ t: '+', n: n++ });
  }
  if (f.old && f.new) eq(f.old.lines.length + 1);
  f.rows = rows;
  f.vis = new Uint8Array(rows.length);
  rows.forEach((r, i) => { if (r.t !== ' ') f.vis.fill(1, Math.max(0, i - CONTEXT), i + CONTEXT + 1); });
  // changed symbols in diff order: innermost declaration around each changed line
  const oldBy = new Map((f.old?.syms ?? []).map((s) => [s.path, s])), newBy = new Map((f.new?.syms ?? []).map((s) => [s.path, s]));
  const seen = new Map();
  rows.forEach((r, i) => {
    if (r.t === ' ') return;
    const s = symAt(f, r), key = s ? s.path : '(module scope)';
    if (seen.has(key)) return;
    const a = oldBy.get(key), b = newBy.get(key);
    const status = !s ? 'modified' : !a ? 'added' : !b ? 'removed' : a.hash === b.hash ? 'format' : 'modified';
    seen.set(key, { path: key, status, row: i });
  });
  f.changed = [...seen.values()];
  f.add = rows.filter((r) => r.t === '+').length;
  f.del = rows.filter((r) => r.t === '-').length;
}
const symAt = (f, r) => (r.t === '-' ? innermost(f.old?.syms, r.o) : innermost(f.new?.syms, r.n));
const rowLine = (r, side) => (side === 'old' ? r.o : r.n);

function renderBody(f) {
  if (f.binary) return '<div class="note">binary file</div>';
  if (!f.rows) return '<div class="note">no text content (too large or not readable)</div>';
  let html = '';
  const N = f.rows.length;
  for (let i = 0, j; i < N; i = j) {
    if (!f.vis[i]) {
      for (j = i; j < N && !f.vis[j]; j++);
      html += `<div class="gap" data-gap="${i}:${j}">⋯ ${j - i} unchanged lines</div>`;
      continue;
    }
    for (j = i; j < N && f.vis[j]; j++);
    // breadcrumb: the declaration around the first change of this run
    let k = i;
    while (k < j && f.rows[k].t === ' ') k++;
    const anchor = f.rows[k < j ? k : i], side = anchor.t === '-' ? 'old' : 'new', sym = symAt(f, anchor);
    let crumb = '';
    if (sym) {
      const parts = sym.path.split(' › ');
      const declShown = f.rows.slice(i, j).some((r) => rowLine(r, side) === sym.decl);
      const partial = f.rows.some((r, x) => !f.vis[x] && rowLine(r, side) >= sym.start && rowLine(r, side) <= sym.end);
      crumb = `<div class="crumb"><span class="k">${esc(sym.kind)}</span><span>${parts.slice(0, -1).map((p) => esc(p) + ' › ').join('')}<b>${esc(parts.at(-1))}</b></span>` +
        (partial ? `<button data-whole="${side}:${sym.start}:${sym.end}">show whole ${esc(sym.kind)}</button>` : '') +
        (declShown ? '' : `<code class="sig">${lineHtml(f[side], sym.decl)}</code>`) + '</div>';
    } else if (f.ts) crumb = '<div class="crumb"><span class="k">module scope</span></div>';
    html += `<div class="run">${crumb}`;
    for (let x = i; x < j; x++) {
      const r = f.rows[x], s = r.t === '-' ? 'old' : 'new', ln = rowLine(r, s);
      html += `<div class="r ${r.t === '+' ? 'add' : r.t === '-' ? 'del' : ''}" data-side="${s}" data-line="${ln}" data-i="${x}">` +
        `<span class="ln">${r.o ?? ''}</span><span class="ln">${r.n ?? ''}</span><code>${lineHtml(f[s], ln)}</code></div>`;
    }
    html += '</div>';
  }
  return html;
}

const rkey = (f) => `semreview:${R.repo}:${R.mergeBase}:${f.path}`;
function fileCard(f, fi) {
  const done = !!store.get(rkey(f));
  const tests = R.files.filter((t) => t.testFor === f.path);
  const links = f.testFor ? `<a data-goto="${esc(f.testFor)}" title="tests for">↑ ${esc(f.testFor.split('/').pop())}</a>` :
    tests.map((t) => `<a data-goto="${esc(t.path)}" title="changed tests">🧪 ${esc(t.path.split('/').pop())}</a>`).join(' ');
  const closed = done || R.groups[f.group].collapsed;
  return `<section class="file${closed ? ' closed' : ''}" id="file-${fi}" data-fi="${fi}" data-path="${esc(f.path)}" data-oldpath="${esc(f.oldPath ?? f.path)}">
    <div class="fh"><span class="st st-${f.status}">${f.status}</span>
      <span class="fp${done ? ' done' : ''}" data-toggle title="click to collapse/expand">${f.oldPath && f.oldPath !== f.path ? esc(f.oldPath) + ' → ' : ''}${esc(f.path)}</span>
      <span class="stat">+${f.add ?? 0} −${f.del ?? 0}</span> ${links}<span class="grow"></span>
      <label><input type="checkbox" data-reviewed ${done ? 'checked' : ''}> reviewed</label></div>
    <div class="body">${closed ? '' : renderBody(f)}</div></section>`;
}
function rerender(fi) {
  const el = $(`#file-${fi}`);
  if (!el.classList.contains('closed')) $('.body', el).innerHTML = renderBody(R.files[fi]);
}

// ---------- page ----------
async function load() {
  const keep = $('#main').scrollTop;
  $('#info').textContent = 'fetching and diffing…';
  const res = await api('review');
  R = await res.json();
  if (!res.ok) {
    const prs = (R.prs ?? []).map((p) => `<li><a href="${location.pathname.replace(/\d+\/?$/, p.number)}">#${p.number}</a> ${esc(p.title)} <span class="stat">${esc(p.state.toLowerCase())}</span></li>`).join('');
    $('#info').textContent = '';
    $('#files').innerHTML = `<div class="note">${esc(R.error)}${prs ? `<p>Pull requests mentioning it:</p><ul>${prs}</ul>` : ''}</div>`;
    return;
  }
  R.files.forEach((f) => { if (!f.hidden && !f.binary && (f.old || f.new)) build(f); });
  const add = R.files.reduce((a, f) => a + (f.add ?? 0), 0), del = R.files.reduce((a, f) => a + (f.del ?? 0), 0);
  $('#info').textContent = `${R.repo} · ${R.base} (${R.mergeBase}) → ${R.head} · ${R.files.length} files +${add} −${del}` +
    (R.semantics ? ` · TS ${R.tsVersion}` : ' · no typescript package found: plain diff') + R.warnings.map((w) => ` · ⚠ ${w}`).join('');
  document.title = `semreview · ${R.repo}`;
  let html = '', g = -1;
  R.files.forEach((f, fi) => {
    if (f.hidden) return;
    if (f.group !== g) { g = f.group; html += `<div class="ghead">${esc(R.groups[g].name)}${R.groups[g].collapsed ? ' <span class="stat">(collapsed)</span>' : ''}</div>`; }
    html += fileCard(f, fi);
  });
  const hidden = R.files.filter((f) => f.hidden);
  if (hidden.length) html += `<div class="hiddenlist">Hidden by config (${hidden.length}): ${hidden.map((f) => esc(f.path)).join(', ')}</div>`;
  $('#files').innerHTML = html;
  renderSide();
  $('#main').scrollTop = keep;
}

function renderSide() {
  let html = '', g = -1;
  R.files.forEach((f, fi) => {
    if (f.hidden) return;
    if (f.group !== g) { g = f.group; html += `<div class="sg">${esc(R.groups[g].name)}</div>`; }
    const done = store.get(rkey(f)) ? ' done' : '';
    if (tab === 'files') {
      html += `<div class="sy${done}" data-file="${fi}" title="${esc(f.path)}"><span class="badge st-${f.status}">${f.status}</span>${esc(f.path)} <span class="stat">+${f.add ?? 0} −${f.del ?? 0}</span></div>`;
      return;
    }
    html += `<div class="sf${done}" data-file="${fi}" title="${esc(f.path)}">${esc(f.path)}</div>`;
    if (!f.ts) return;
    for (const c of f.changed ?? []) {
      const b = { added: '+', removed: '−', modified: '~', format: '≈' }[c.status];
      html += `<div class="sy" data-file="${fi}" data-row="${c.row}" title="${c.status}${c.status === 'format' ? ': whitespace/comments only' : ''}"><span class="badge b-${c.status}">${b}</span>${esc(c.path)}</div>`;
    }
  });
  $('#sideBody').innerHTML = html;
}

function goto(fi, row) {
  const el = $(`#file-${fi}`);
  if (el.classList.contains('closed')) { el.classList.remove('closed'); rerender(fi); }
  const target = row === undefined ? el : $(`[data-i="${row}"]`, el);
  const main = $('#main');
  main.scrollTop += target.getBoundingClientRect().top - main.getBoundingClientRect().top - (row === undefined ? 0 : 120);
}

// ---------- hover / definition ----------
function caretCol(e) {
  const code = e.target.closest('code');
  if (!code || e.target.tagName !== 'SPAN') return null;
  let node, offset;
  if (document.caretPositionFromPoint) { const p = document.caretPositionFromPoint(e.clientX, e.clientY); if (!p) return null; node = p.offsetNode; offset = p.offset; }
  else { const r = document.caretRangeFromPoint(e.clientX, e.clientY); if (!r) return null; node = r.startContainer; offset = r.startOffset; }
  if (!code.contains(node)) return null;
  const range = document.createRange();
  range.setStart(code, 0); range.setEnd(node, offset);
  const text = code.textContent, w = /[\w$#]/;
  let col = range.toString().length;
  if (!w.test(text[col] ?? '')) { if (w.test(text[col - 1] ?? '')) col--; else return null; }
  while (col > 0 && w.test(text[col - 1])) col--; // word start, so the cache key is per identifier
  return col;
}
function where(e) {
  const row = e.target.closest('.r');
  if (!row) return null;
  const col = caretCol(e);
  if (col === null) return null;
  const host = row.closest('[data-path]'), side = row.dataset.side;
  return { side, path: side === 'old' ? host.dataset.oldpath : host.dataset.path, line: +row.dataset.line, col };
}
const qs = (w) => `side=${w.side}&path=${encodeURIComponent(w.path)}&line=${w.line}&col=${w.col}`;
const hoverCache = new Map();
let hoverTimer, hoverKey;
document.addEventListener('mousemove', (e) => {
  document.body.classList.toggle('mod', e.ctrlKey || e.metaKey);
  const w = R?.semantics && where(e), key = w && qs(w);
  if (key === hoverKey) return positionTip(e);
  hoverKey = key;
  clearTimeout(hoverTimer);
  $('#tip').hidden = true;
  if (!w) return;
  hoverTimer = setTimeout(async () => {
    if (!hoverCache.has(key)) hoverCache.set(key, api('hover', key).then((r) => r.json()).catch(() => null));
    const h = await hoverCache.get(key);
    if (hoverKey !== key || !h?.sig) return;
    const tip = $('#tip');
    const doc = [h.doc, ...h.tags].filter(Boolean).join('\n');
    tip.innerHTML = `<pre>${esc(h.sig)}</pre>` + (doc ? `<div class="doc">${esc(doc)}</div>` : '');
    tip.hidden = false;
    positionTip(e);
  }, 250);
});
function positionTip(e) {
  const tip = $('#tip');
  if (tip.hidden) return;
  tip.style.left = Math.max(8, Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8)) + 'px';
  const below = e.clientY + 18;
  tip.style.top = (below + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 8 : below) + 'px';
}

// definition peek, with a back stack
const peek = { stack: [] };
const fileCache = new Map();
async function showPeek(side, path, line) {
  const k = `${side}:${path}`;
  if (!fileCache.has(k)) fileCache.set(k, api('file', `side=${side}&path=${encodeURIComponent(path)}`).then((r) => (r.ok ? r.json() : null)));
  const sd = prep(await fileCache.get(k));
  if (!sd) return;
  const from = Math.max(1, line - 150), to = Math.min(sd.lines.length, line + 350); // ponytail: a window, lib.dom.d.ts has 40k lines
  let html = `<div class="pbar"><button data-pback ${peek.stack.length > 1 ? '' : 'disabled'}>←</button>` +
    `<span class="grow mono" title="${esc(path)}">${side === 'old' ? '[base] ' : ''}${esc(path)}:${line}</span><button data-pclose>×</button></div>` +
    `<div data-path="${esc(path)}" data-oldpath="${esc(path)}">`;
  if (from > 1) html += `<div class="note">… ${from - 1} lines above</div>`;
  for (let n = from; n <= to; n++) html += `<div class="r${n === line ? ' hl' : ''}" data-side="${side}" data-line="${n}"><span class="ln">${n}</span><code>${lineHtml(sd, n)}</code></div>`;
  if (to < sd.lines.length) html += `<div class="note">… ${sd.lines.length - to} lines below</div>`;
  const el = $('#peek');
  el.innerHTML = html + '</div>';
  el.hidden = false;
  const hl = $('.r.hl', el);
  if (hl) el.scrollTop = hl.offsetTop - el.clientHeight / 3;
}
async function definition(w) {
  const defs = await (await api('def', qs(w))).json();
  if (!defs?.length) return;
  const d = defs[0]; // ponytail: first of several (overloads, declaration merging); add a picker when it bites
  peek.stack.push({ side: w.side, path: d.path, line: d.line });
  showPeek(w.side, d.path, d.line);
}
function closePeek() { $('#peek').hidden = true; peek.stack = []; }

// ---------- events ----------
document.addEventListener('click', (e) => {
  const t = e.target;
  if ((e.ctrlKey || e.metaKey) && R?.semantics) {
    const w = where(e);
    if (w) { e.preventDefault(); return definition(w); }
  }
  const fileEl = t.closest('.file'), fi = fileEl && +fileEl.dataset.fi;
  if (t.closest('[data-toggle]')) { fileEl.classList.toggle('closed'); return rerender(fi); }
  if (t.dataset.gap) { const [a, b] = t.dataset.gap.split(':').map(Number); R.files[fi].vis.fill(1, a, b); return rerender(fi); }
  if (t.dataset.whole) {
    const [side, s, en] = t.dataset.whole.split(':'), f = R.files[fi];
    f.rows.forEach((r, x) => { const l = rowLine(r, side); if (l >= +s && l <= +en) f.vis[x] = 1; });
    return rerender(fi);
  }
  if (t.dataset.goto) return goto(R.files.findIndex((f) => f.path === t.dataset.goto));
  const nav = t.closest('[data-file]');
  if (nav) return goto(+nav.dataset.file, nav.dataset.row === undefined ? undefined : +nav.dataset.row);
  if (t.closest('[data-pclose]')) return closePeek();
  if (t.closest('[data-pback]')) { peek.stack.pop(); const p = peek.stack.at(-1); if (p) showPeek(p.side, p.path, p.line); return; }
  if (t.dataset.tab) {
    tab = t.dataset.tab;
    document.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
    renderSide();
  }
});
document.addEventListener('change', (e) => {
  if (!('reviewed' in e.target.dataset)) return;
  const fileEl = e.target.closest('.file'), fi = +fileEl.dataset.fi;
  store.set(rkey(R.files[fi]), e.target.checked ? '1' : null);
  fileEl.classList.toggle('closed', e.target.checked);
  $('.fp', fileEl).classList.toggle('done', e.target.checked);
  rerender(fi);
  renderSide();
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('input, textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') return closePeek();
  if (e.key !== 'j' && e.key !== 'k') return;
  const cards = [...document.querySelectorAll('.file')], top = $('#main').getBoundingClientRect().top + 40;
  let cur = cards.findIndex((c) => c.getBoundingClientRect().bottom > top);
  if (cur < 0) cur = cards.length - 1;
  const atTop = cards[cur] && Math.abs(cards[cur].getBoundingClientRect().top - top + 40) < 2;
  const next = cards[Math.max(0, Math.min(cards.length - 1, e.key === 'j' ? cur + 1 : atTop ? cur - 1 : cur))];
  if (next) goto(+next.dataset.fi);
});
document.addEventListener('keyup', (e) => { if (e.key === 'Control' || e.key === 'Meta') document.body.classList.remove('mod'); });
$('#reload').onclick = load;
$('#apiBtn').onclick = async () => {
  const el = $('#api');
  el.hidden = false;
  el.innerHTML = '<h3>Exported API changes</h3><div class="note">building base and head programs…</div>';
  const list = await (await api('apidiff')).json();
  const sign = { added: '+', removed: '−', changed: '~' };
  el.innerHTML = '<h3>Exported API changes</h3>' + (!list?.length ? '<div class="note">No exported signature changed.</div>' :
    list.map((a) => `<div class="apie"><span class="badge b-${a.change === 'changed' ? 'modified' : a.change}">${sign[a.change]}</span>
      <b class="mono">${esc(a.name)}</b> <span class="stat">${esc(a.kind)} · ${esc(a.path)}</span>
      ${a.before !== undefined ? `<pre class="b">${esc(a.before)}</pre>` : ''}${a.after !== undefined ? `<pre class="a">${esc(a.after)}</pre>` : ''}</div>`).join(''));
};
load();
</script>
